<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <!-- Landscape Logo for Light Backgrounds -->
  
  <!-- Monitor & Megaphone Icon Lockup -->
  <g transform="translate(6, 10)">
    <!-- Monitor Screen Outline -->
    <rect x="2" y="2" width="48" height="34" rx="6" fill="none" stroke="#72BA40" stroke-width="3.2"/>
    
    <!-- Monitor Stand -->
    <path d="M23 36 V41 M16 41 H36" stroke="#72BA40" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Megaphone Inside Screen -->
    <rect x="11" y="15" width="4" height="8" rx="1.5" fill="#72BA40"/>
    <path d="M14 17 L25 12 V26 L14 21 Z" fill="#72BA40"/>
    <path d="M25 11.5 C26.8 11.5 27.5 13 27.5 19 C27.5 25 26.8 26.5 25 26.5" stroke="#72BA40" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M17 20 V25.5 H20.5" stroke="#72BA40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sound Waves / Announcement Sparks -->
    <path d="M30 14 L33 12.5" stroke="#72BA40" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M31 19 H35" stroke="#72BA40" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M30 24 L33 25.5" stroke="#72BA40" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Typography Lockup in Landscape -->
  <g transform="translate(70, 0)">
    <!-- MIND SHIFT (Horizontal for light background) -->
    <text x="0" y="36" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.02em">
      <tspan fill="#050505">MIND</tspan>
      <tspan fill="#050505" dx="6">SH</tspan><tspan fill="#72BA40">I</tspan><tspan fill="#050505">FT</tspan>
    </text>

    <!-- TECH Subtitle Lockup -->
    <text x="2" y="55" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" letter-spacing="0.32em" fill="#72BA40">
      TECH
    </text>
  </g>
</svg>
